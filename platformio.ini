; NanoExtend — exact version pins (no floating deps)
; Candidate: pioarduino 55.03.39 = Arduino-ESP32 3.3.9 / ESP-IDF 5.5.4
; Promote only after NAPT link + hardware smoke gates pass.

[platformio]
default_envs = esp32dev
description = NanoExtend ESP32 SoftAP+STA Wi-Fi NAT travel router
src_dir = src
include_dir = include

[env:esp32dev]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 460800
upload_port = /dev/ttyUSB0
monitor_port = /dev/ttyUSB0
board_build.partitions = partitions/nanoextend_4mb_ota.csv
board_build.filesystem = littlefs
board_build.f_cpu = 240000000L
board_build.flash_mode = dio

build_flags =
  -DCORE_DEBUG_LEVEL=1
  -DCONFIG_ASYNC_TCP_RUNNING_CORE=1
  -DCONFIG_ASYNC_TCP_USE_WDT=0
  -DCONFIG_BOOTLOADER_APP_ROLLBACK_ENABLE=1
  -DNANOEXTEND_FW_VERSION=\"1.0.5\"
  -I include

lib_deps =
  https://github.com/ESP32Async/ESPAsyncWebServer.git#v3.6.0
  https://github.com/ESP32Async/AsyncTCP.git#v3.3.2
  bblanchon/ArduinoJson@7.3.0

lib_ignore =
  AsyncTCP_RP2040W

extra_scripts =
  pre:scripts/embed_assets.py

monitor_filters = esp32_exception_decoder, time
