name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install platformio==6.1.19
      - name: Build firmware
        run: pio run -e esp32dev
      - name: Package release
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          mkdir -p release
          cp .pio/build/esp32dev/firmware.factory.bin "release/nanoextend-${VERSION#v}.factory.bin"
          cp .pio/build/esp32dev/firmware.bin "release/nanoextend-${VERSION#v}.ota.bin"
          cp .pio/build/esp32dev/firmware.elf "release/nanoextend-${VERSION#v}.elf"
          python3 scripts/release_manifest.py \
            --version "${VERSION#v}" \
            --factory "release/nanoextend-${VERSION#v}.factory.bin" \
            --ota "release/nanoextend-${VERSION#v}.ota.bin" \
            --base-url "https://github.com/${{ github.repository }}/releases/download/${VERSION}" \
            --output release/manifest.json
          sha256sum release/*.bin release/*.elf > release/SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release/*.bin
            release/*.elf
            release/manifest.json
            release/SHA256SUMS

  verify-website:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
        working-directory: website
      - run: npm run build
        working-directory: website
